name: sailpoint-rpa-studio

x-app: &app
  image: sailpoint-rpa-studio-app:0.1
  env_file: .env
  volumes:
    - artifacts:/data/artifacts
  init: true
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "worker.worker"]
    shm_size: 1gb
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  legacy:
    <<: *app
    command:
      [
        "uvicorn",
        "demo.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8081",
        "--no-access-log"
      ]
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DEMO_DB: /data/artifacts/demo.db
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  postgres:
  redis:
  artifacts:
