[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sailpoint-rpa-studio"
version = "0.1.0"
description = "Web RPA orchestration for IAM — functional phase-one MVP"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<2.1",
 "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "alembic>=1.14,<2",
 "playwright==1.51.0", "redis>=5.2,<6", "rq>=2.2,<3", "PyJWT>=2.10,<3",
 "argon2-cffi>=23.1,<26", "cryptography>=44,<47", "jinja2>=3.1.5,<4",
 "httpx>=0.28,<1"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "fakeredis[lua]>=2.26,<3"]
[tool.setuptools.packages.find]
include = ["backend*", "worker*", "recorder*", "demo*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"backend.app" = ["templates/*.html", "static/*.css", "static/*.js"]
"recorder" = ["*.html", "*.js", "*.css"]
"demo" = ["*.html", "*.js", "*.json"]
